name: Keep scheduled workflows active

# GitHub auto-disables scheduled workflows after 60 days without repository
# push activity. This repo's Pages deploy runs on a schedule but never
# pushes back to git, so without this workflow it silently goes dark.
# Runs well inside that window to keep the repo "active".
on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Record keepalive timestamp
        run: |
          mkdir -p .github
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/keepalive
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive
          if ! git diff --cached --quiet; then
            git commit -m "chore: keepalive commit to prevent workflow auto-disable"
            git push
          fi
